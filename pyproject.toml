
[project]
name = "pytorch-template"
version = "0.1.0"
description = "PyTorch CUDA 12.8 notebook template"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ipykernel",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
